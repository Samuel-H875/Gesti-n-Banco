<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="contenedor">
    <div class="mensaje">
        <h2 th:text="${mensaje}"></h2>
    </div>

    <div class="tarjeta" th:if="${cliente != null}">
        <p><strong>Cliente:</strong> <span th:text="${cliente.nombre}"></span></p>
        <p><strong>Documento:</strong> <span th:text="${cliente.documento}"></span></p>
        <p><strong>Correo:</strong> <span th:text="${cliente.correo}"></span></p>
        <p><strong>Teléfono:</strong> <span th:text="${cliente.telefono}"></span></p>
        <p><strong>Número de cliente:</strong> <span th:text="${cliente.numeroCliente}"></span></p>
    </div>

    <a href="/" class="volver">Volver al inicio</a>
</div>
</body>
</html>
