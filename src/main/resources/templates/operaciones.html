<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="contenedor">
    <header>
        <h1>Operaciones bancarias</h1>
    </header>

    <div class="mensaje" th:if="${mensaje != null}">
        <p th:text="${mensaje}"></p>
    </div>

    <div class="tarjeta" th:each="cuenta : ${cuentas}">
        <h2 th:text="${cuenta.tipo}"></h2>
        <p>Número de cuenta: <strong th:text="${cuenta.numeroCuenta}"></strong></p>
        <p>Saldo actual: <strong>$<span th:text="${#numbers.formatDecimal(cuenta.saldo, 1, 2)}"></span></strong></p>

        <form action="/depositar" method="post" class="formulario pequeno">
            <input type="hidden" name="numeroCuenta" th:value="${cuenta.numeroCuenta}">
            <label>Valor a depositar</label>
            <input type="number" name="cantidad" min="1" step="0.01" required>
            <button type="submit">Depositar</button>
        </form>

        <form action="/retirar" method="post" class="formulario pequeno">
            <input type="hidden" name="numeroCuenta" th:value="${cuenta.numeroCuenta}">
            <label>Valor a retirar</label>
            <input type="number" name="cantidad" min="1" step="0.01" required>
            <button type="submit">Retirar</button>
        </form>
    </div>

    <a href="/" class="volver">Volver al inicio</a>
</div>
</body>
</html>
